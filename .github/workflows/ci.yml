name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - run: uv run mining-daily brief --output runs/ci-brief.md
      - uses: actions/upload-artifact@v4
        with:
          name: demo-python-${{ matrix.python-version }}
          path: runs/ci-brief.*
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --build --rm agent
      - run: test -s runs/brief.md && test -s runs/brief.json
